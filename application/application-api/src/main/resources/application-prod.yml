# Production profile: schema is never touched by the application.
spring:
  jpa:
    hibernate:
      ddl-auto: none

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.project: INFO

app:
  persistence:
    dialect: MYSQL
    default-page-size: 20
    max-page-size: 100
