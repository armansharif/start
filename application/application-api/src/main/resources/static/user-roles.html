<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>نقش‌های کاربر | Backend Platform</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
    <div>
        <h1>نقش‌های کاربر</h1>
        <p class="who" id="who">—</p>
    </div>
    <nav class="nav">
        <a href="/users.html">کاربران</a>
        <a href="/roles.html">نقش‌ها</a>
        <button type="button" class="btn-ghost" id="logout">خروج</button>
    </nav>
</header>

<main class="page">
    <div class="alert" id="error" role="alert"></div>
    <div class="alert ok" id="success" role="status"></div>

    <section class="card card-pad user-head">
        <div>
            <h2 id="user-name">—</h2>
            <p class="who" id="user-meta">—</p>
        </div>
        <a class="btn-ghost btn-link" href="/users.html">بازگشت به کاربران</a>
    </section>

    <section class="card card-pad">
        <h3>نقش‌های فعلی</h3>
        <p class="muted-small">با زدن «حذف» نقش بلافاصله از این کاربر گرفته می‌شود.</p>
        <div class="chips" id="current-roles">
            <span class="muted-small">در حال بارگذاری…</span>
        </div>
    </section>

    <section class="card card-pad">
        <h3>ویرایش نقش‌ها</h3>
        <p class="muted-small">نقش‌های مورد نظر را انتخاب و ذخیره کنید؛ فهرست ارسالی جایگزین نقش‌های فعلی می‌شود.</p>
        <div class="role-options" id="role-options">
            <span class="muted-small">در حال بارگذاری…</span>
        </div>
        <div class="form-actions">
            <button type="button" class="btn-primary btn-inline" id="save">ذخیره نقش‌ها</button>
            <button type="button" class="btn-ghost" id="reset">بازگردانی</button>
        </div>
    </section>
</main>

<script>
    const params = new URLSearchParams(location.search);
    const userId = params.get('id');

    if (!sessionStorage.getItem('accessToken')) {
        location.replace('/');
    } else if (!userId) {
        location.replace('/users.html');
    }

    const errorBox = document.getElementById('error');
    const successBox = document.getElementById('success');
    const currentRoles = document.getElementById('current-roles');
    const roleOptions = document.getElementById('role-options');
    const saveButton = document.getElementById('save');

    let allRoles = [];
    let assignedCodes = [];

    function currentUsername() {
        const token = sessionStorage.getItem('accessToken');
        if (!token || token.split('.').length < 2) {
            return null;
        }
        try {
            const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(atob(base64)).username || null;
        } catch (error) {
            return null;
        }
    }

    document.getElementById('who').textContent =
        'وارد شده به عنوان ' + (currentUsername() || 'کاربر');

    function showError(message) {
        successBox.classList.remove('visible');
        errorBox.textContent = message;
        errorBox.classList.add('visible');
    }

    function showSuccess(message) {
        errorBox.classList.remove('visible');
        successBox.textContent = message;
        successBox.classList.add('visible');
    }

    function clearMessages() {
        errorBox.classList.remove('visible');
        successBox.classList.remove('visible');
    }

    function signOut() {
        sessionStorage.clear();
        location.replace('/');
    }

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function refreshToken() {
        const stored = sessionStorage.getItem('refreshToken');
        if (!stored) {
            return false;
        }
        const response = await fetch('/api/v1/auth/refresh', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({refreshToken: stored})
        });
        const body = await response.json().catch(() => null);
        if (!response.ok || !body || !body.success || !body.data) {
            return false;
        }
        sessionStorage.setItem('accessToken', body.data.accessToken);
        sessionStorage.setItem('refreshToken', body.data.refreshToken);
        return true;
    }

    async function apiFetch(path, options) {
        const send = (token) => fetch(path, {
            ...options,
            headers: {
                ...(options && options.headers ? options.headers : {}),
                ...(token ? {Authorization: 'Bearer ' + token} : {})
            }
        });

        let response = await send(sessionStorage.getItem('accessToken'));
        if (response.status === 401 && await refreshToken()) {
            response = await send(sessionStorage.getItem('accessToken'));
        }
        if (response.status === 401) {
            signOut();
        }
        return response;
    }

    function errorDetail(body, fallback) {
        return (body && (body.message || (body.errors && body.errors[0] && body.errors[0].message))) || fallback;
    }

    function renderCurrentRoles() {
        if (assignedCodes.length === 0) {
            currentRoles.innerHTML = '<span class="muted-small">این کاربر هیچ نقشی ندارد.</span>';
            return;
        }
        currentRoles.innerHTML = assignedCodes.map((code) => `
            <span class="chip">
                ${escapeHtml(code)}
                <button type="button" class="chip-remove" data-code="${escapeHtml(code)}"
                        title="حذف نقش" aria-label="حذف نقش ${escapeHtml(code)}">×</button>
            </span>`).join('');
        currentRoles.querySelectorAll('.chip-remove').forEach((button) => {
            button.addEventListener('click', () => removeRole(button.dataset.code));
        });
    }

    function renderRoleOptions() {
        if (allRoles.length === 0) {
            roleOptions.innerHTML = '<span class="muted-small">نقشی تعریف نشده است.</span>';
            return;
        }
        roleOptions.innerHTML = allRoles.map((role) => `
            <label class="role-option">
                <input type="checkbox" value="${escapeHtml(role.code)}"
                       ${assignedCodes.includes(role.code) ? 'checked' : ''}>
                <span>${escapeHtml(role.title)} <code>${escapeHtml(role.code)}</code></span>
            </label>`).join('');
    }

    function selectedCodes() {
        return Array.from(roleOptions.querySelectorAll('input[type="checkbox"]'))
            .filter((input) => input.checked)
            .map((input) => input.value);
    }

    async function loadUser() {
        const response = await apiFetch('/api/v1/users/' + encodeURIComponent(userId));
        const body = await response.json().catch(() => null);
        if (response.status === 401) {
            return false;
        }
        if (!response.ok || !body || !body.success) {
            showError(errorDetail(body, 'دریافت اطلاعات کاربر ناموفق بود.'));
            return false;
        }
        const user = body.data;
        document.getElementById('user-name').textContent = user.fullName || user.username;
        document.getElementById('user-meta').textContent =
            'نام کاربری: ' + user.username + ' — وضعیت: ' + user.status;
        assignedCodes = (user.roles || []).slice();
        return true;
    }

    async function loadRoles() {
        const response = await apiFetch('/api/v1/roles');
        const body = await response.json().catch(() => null);
        if (response.status === 401) {
            return false;
        }
        if (!response.ok || !body || !body.success) {
            showError(errorDetail(body, 'دریافت لیست نقش‌ها ناموفق بود.'));
            return false;
        }
        allRoles = body.data || [];
        return true;
    }

    async function reload(message) {
        clearMessages();
        const ok = await loadUser() && await loadRoles();
        if (!ok) {
            return;
        }
        renderCurrentRoles();
        renderRoleOptions();
        if (message) {
            showSuccess(message);
        }
    }

    async function saveRoles() {
        const codes = selectedCodes();
        if (codes.length === 0 && !confirm('با این کار همهٔ نقش‌های کاربر حذف می‌شود. ادامه می‌دهید؟')) {
            return;
        }
        saveButton.disabled = true;
        try {
            const response = await apiFetch('/api/v1/users/' + encodeURIComponent(userId) + '/roles', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({roles: codes})
            });
            const body = await response.json().catch(() => null);
            if (response.status === 401) {
                return;
            }
            if (!response.ok || !body || !body.success) {
                showError(errorDetail(body, 'ذخیره نقش‌ها ناموفق بود.'));
                return;
            }
            await reload('نقش‌های کاربر ذخیره شد.');
        } catch (error) {
            showError('ارتباط با سرور برقرار نشد.');
        } finally {
            saveButton.disabled = false;
        }
    }

    async function removeRole(code) {
        if (!confirm('نقش «' + code + '» از این کاربر حذف شود؟')) {
            return;
        }
        try {
            const response = await apiFetch('/api/v1/users/' + encodeURIComponent(userId)
                + '/roles/' + encodeURIComponent(code), {method: 'DELETE'});
            const body = await response.json().catch(() => null);
            if (response.status === 401) {
                return;
            }
            if (!response.ok || !body || !body.success) {
                showError(errorDetail(body, 'حذف نقش ناموفق بود.'));
                return;
            }
            await reload('نقش «' + code + '» حذف شد.');
        } catch (error) {
            showError('ارتباط با سرور برقرار نشد.');
        }
    }

    saveButton.addEventListener('click', saveRoles);
    document.getElementById('reset').addEventListener('click', () => reload());

    document.getElementById('logout').addEventListener('click', async () => {
        const stored = sessionStorage.getItem('refreshToken');
        try {
            await fetch('/api/v1/auth/logout', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({refreshToken: stored})
            });
        } catch (error) {
            // A failed logout call must not keep the user inside the page.
        }
        signOut();
    });

    if (userId && sessionStorage.getItem('accessToken')) {
        reload();
    }
</script>
</body>
</html>
