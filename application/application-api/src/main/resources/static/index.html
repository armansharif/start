<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود | Backend Platform</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="login-wrap">
    <form class="card login-card" id="login-form" autocomplete="on">
        <h1>ورود به پنل</h1>
        <p class="login-subtitle">با حساب کاربری خود وارد شوید تا لیست کاربران را ببینید.</p>

        <div class="alert" id="error" role="alert"></div>

        <label class="field">
            <span>نام کاربری</span>
            <input type="text" id="username" name="username" value="admin" required autofocus>
        </label>

        <label class="field">
            <span>رمز عبور</span>
            <input type="password" id="password" name="password" value="Admin@12345" required>
        </label>

        <button type="submit" class="btn-primary" id="submit">ورود</button>

        <p class="hint">حساب توسعه: admin / Admin@12345<br>توکن‌ها در همین تب ذخیره می‌شوند.</p>
    </form>
</div>

<script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error');
    const submit = document.getElementById('submit');

    if (sessionStorage.getItem('accessToken')) {
        location.replace('/users.html');
    }

    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add('visible');
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.classList.remove('visible');
        submit.disabled = true;
        submit.textContent = 'در حال ورود…';

        try {
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value
                })
            });
            const body = await response.json().catch(() => null);

            if (!response.ok || !body || !body.success || !body.data) {
                const detail = body && (body.message || (body.errors && body.errors[0] && body.errors[0].message));
                showError(detail || 'ورود ناموفق بود.');
                return;
            }

            sessionStorage.setItem('accessToken', body.data.accessToken);
            sessionStorage.setItem('refreshToken', body.data.refreshToken);
            sessionStorage.setItem('accessTokenExpiresAt', body.data.accessTokenExpiresAt || '');
            location.replace('/users.html');
        } catch (error) {
            showError('ارتباط با سرور برقرار نشد.');
        } finally {
            submit.disabled = false;
            submit.textContent = 'ورود';
        }
    });
</script>
</body>
</html>
