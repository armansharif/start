spring:
  application:
    name: backend-platform

  # Every database and Redis connection detail lives in application-db.yml,
  # imported here so that one file (or the APP_DB_* / APP_REDIS_* environment
  # variables) is enough to point the application at another server.
  config:
    import: classpath:application-db.yml

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by versioned SQL scripts in database/. Never create/update it from code.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true

  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Management endpoints stay on a separate port and are not meant for public exposure.
management:
  server:
    port: ${APP_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  security:
    jwt:
      # Never commit a real secret: supply APP_JWT_SECRET (>= 32 bytes) in the environment.
      secret: ${APP_JWT_SECRET:}
      issuer: ${APP_JWT_ISSUER:https://backend-platform.local}
      access-token-ttl: ${APP_JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${APP_JWT_REFRESH_TTL:30d}
  datetime:
    zone: Asia/Tehran
    locale: fa-IR
    persian-digits-output: true
  timezone:
    storage: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.project: INFO
